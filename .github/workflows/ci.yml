name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: quality / repo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intro-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test / ai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intro-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:ai

  test-all:
    name: test / all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intro-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test

